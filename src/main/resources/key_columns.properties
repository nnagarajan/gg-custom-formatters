# Key column mapping for TransactionBoundaryEventJsonFormatter
#
# Copy this file to the GoldenGate dirprm directory, for example:
#   /opt/oracle/ggbd/dirprm/key_columns.properties
# and point the formatter to it in the Replicat properties file (rep3.props):
#   gg.handler.kafkahandler.format.keyColumnsFile=dirprm/key_columns.properties
#
# Format: one line per table
#   SCHEMA.TABLE=COL1,COL2,...
# - SCHEMA.TABLE is the delivered (target) table name, as in the MAP ... TARGET clause.
# - Columns are listed in the order their values appear in key_ids.
# - Names are matched case-insensitively. Blank lines and lines starting with # or ! are ignored.
# - Tables not listed use their primary key. A table with neither a primary key nor an entry
#   abends Replicat.
# - Every listed column must be captured for updates (supplemental logging on the source:
#   ADD TRANDATA <table> COLS (...), plus LOGALLSUPCOLS in Extract). A missing or NULL key value
#   abends Replicat.
# - Read only when gg.handler.kafkahandler.format.markerKeys=true (the default is false); with
#   markerKeys=false this file is not opened.
# - The file is read once at startup; restart Replicat after editing it.

APPUSER.ORDERS=ORDER_ID
APPUSER.ORDER_DETAILS=ORDER_ID,DETAIL_ID
APPUSER.ORDER_LINE_ITEMS=ORDER_ID,LINE_NO
